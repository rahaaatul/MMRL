org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --add-opens=java.base/java.io=ALL-UNNAMED
org.gradle.caching=true
org.gradle.configuration-cache=true

# AGP 9.0+ enables built-in Kotlin by default, which disallows the
# kotlin.sourceSets DSL (KSP relies on it). Keep this opt-out until the
# project migrates to the android.sourceSets DSL; will be removed in AGP 10.
android.disallowKotlinSourceSets=false

# Deprecated (default false, removed in AGP 10) but required here: the app
# still depends on libraries built against the old support library, so
# Jetifier must run at build time. Once those deps are AndroidX-only, drop
# this line.
android.enableJetifier=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kapt.include.compile.classpath=false
kotlin.code.style=official